# Builds, packages and releases the extension when a v* tag is pushed.
#
# Publishing to the Marketplace happens only when the VSCE_PAT secret is set,
# so tagging is safe before that secret exists: the job still builds the VSIX
# and attaches it to the GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Marketplace (requires VSCE_PAT)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload the VSIX as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Attach the VSIX to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Marketplace publishing is opt-in: without the secret this step is skipped
      # and the release still succeeds with the VSIX attached above.
      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        run: npx @vscode/vsce publish --no-dependencies --packagePath *.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' && startsWith(github.ref, 'refs/tags/v') }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
