name: CI

# Adopted from bamr87/bamr87 via standardize-fanout.yml. This is a thin caller —
# the gate logic is shared and versioned in
# bamr87/bamr87/.github/workflows/standard-ci.yml. Don't edit the logic here.
# (main is substituted with the repo's default branch on adoption.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bamr87/bamr87/.github/workflows/standard-ci.yml@main
    # Node 22 rather than the fleet default (vars.NODE_VERSION, 20): Node 20 is
    # end-of-life, and Vitest 5 and @vscode/vsce 4 require Node 22. This is the
    # caller input the shared workflow provides for exactly this, not a change
    # to its logic. Keep it in step with release.yml.
    with:
      node-version: "22"
    secrets: inherit
